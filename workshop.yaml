# Pong — the same game in two languages. A participant reads the starter, then
# does PyPong, LuaPong, or both, in the order they like.
#
# The starter lives in this repo (`accueil/`) and is one step long: a few lines
# saying what the two subjects share, and an "I have read this" button. It is
# an exception among subjects on purpose: no exercise, so no closing step, no
# rating and no "going further" at its end.
#
# The two subjects are unordered `advanced` ones, which the convention reads as
# "free choice" (docs/CONTENT_CONVENTION.md §4.1): both open once the starter
# is read, and neither gates the other.
#
# Two ways to sync this workshop, and they read the same file:
#
#   the admin panel   /admin/workshop/sync on the instance, which fetches this
#                     repo and then each subject from `repo` at `ref`
#   the command line  python3 tools/sync_workshop.py <a --recursive clone>
#                     --url ... --admin-user admin --admin-pass ...
#                     which reads `path`, the submodule directory
schema_version: "2.0"

workshop:
  name: "Pong"
  slug: "pong"
  summary: "Crée ton jeu Pong avec TIC-80, en Python ou en Lua : à toi de choisir."

subjects:
  # No `repo`: this one is a directory of this repository.
  - path: accueil
    role: starter

  - repo: kevin-cazal/pypong_subject
    path: pypong_subject
    # A branch: every sync from the admin panel takes that subject's tip, which
    # is what a dev instance wants while the subjects are being written. Put
    # `submodule` to follow the pin recorded in this repo (what a clone gives
    # you), or a tag or a sha, to freeze a subject for a session.
    # The command line reads `path`, so it still imports the submodule checkout.
    ref: content/lint-fixes
    role: advanced

  - repo: kevin-cazal/luapong_subject
    path: luapong_subject
    ref: main
    role: advanced
