# A bonus subject of the Pong workshop — convention 2.0 (docs/CONTENT_CONVENTION.md §3.2).
# A short introduction and one step, validated by an instructor code. It lives
# in the workshop repo because it is too small to deserve one of its own.
schema_version: "2.0"

project:
  name: "JSPong"
  slug: "jspong"
  summary: "Bonus : refais ton jeu Pong en JavaScript avec TIC-80."
  entrypoint: "intro.md"

# Same pane as PyPong and LuaPong: one TIC-80 dist serves the whole workshop.
runtime:
  engine: "TIC-80"
  language: "javascript"
  id: "tic80"
  version: "8a7cb53"          # tic80-web-editor_runtime commit the dist was built from
  title: "TIC-80"
  params:
    repl: off
  pane:
    placement: side
    open: false
    size: 55

platform:
  mode_default: instructor_led
  validation_default: checkpoint
  points_default: 25

documents:
  - intro.md
  - jspong.md
